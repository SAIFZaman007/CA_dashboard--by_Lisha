# Coach Auto dashboard — static SPA + reverse proxy to the API.
#
# The proxy is what keeps the refresh cookie first-party. Do not remove it in
# favour of pointing the browser straight at the API domain unless you have
# also switched the backend to SameSite=None cookies.
#
# Two deployment shapes are supported; see the equivalent note in the client
# portal's nginx.conf for the full explanation. In short: either the browser
# talks only to this server (leave VITE_API_URL and PUBLIC_API_URL blank), or
# it talks to the API on its own hostname (set both to the same value). The
# combination that fails is setting VITE_API_URL while the API still emits
# root-relative media paths — JSON works, every image and video 502s.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # An internal tool: keep it out of indexes and out of frames.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # frame-src allows the hosted tutorial preview players. img-src allows the
    # video host thumbnails the coach pastes in.
    #
    # SPLIT-ORIGIN: the API origin appears in img-src, media-src and
    # connect-src because uploaded tutorial previews and message attachments
    # are served from there. `media-src https:` was already wide enough to
    # cover the video element by accident; the attachments in the inbox were
    # not, which is why they were the ones that broke. It must match
    # PUBLIC_API_URL on the backend exactly, scheme included.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com https://i.vimeocdn.com https://ca-backend.maktechgroups.com; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://ca-backend.maktechgroups.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- API proxy ------------------------------------------------------------
    #
    # `^~` stops nginx testing the static-file regex below against API paths.
    # Regex locations are evaluated before prefix ones, so without it a request
    # whose path ends in an image extension would be served from the static
    # root instead of reaching the backend.
    location ^~ /api/ {
        # Resolve the upstream at request time via Docker's internal DNS, so a
        # backend that is slow to start does not stop nginx from booting.
        #
        # A wrong name here is indistinguishable from a dead backend: nginx has
        # nothing to proxy to and answers 502. Verify it against the backend's
        # real service name on this network before assuming it is correct.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8000;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # The coach's own preview player seeks through uploaded clips, so range
        # requests have to survive the hop in both directions.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering off;
        proxy_request_buffering off;

        # This is the side that uploads tutorial videos. The old 12 MB ceiling
        # rejected every real upload with a 413 before the request reached the
        # API — which is why MAX_VIDEO_UPLOAD_MB appeared to be ignored in
        # production and honoured locally, where Vite's dev proxy has no such
        # limit. Keep this at or above MAX_VIDEO_UPLOAD_MB.
        client_max_body_size 550M;
        client_body_timeout 600s;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static build artefacts only — `^~ /api/` above is matched first.
    location ~* \.(png|jpe?g|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}